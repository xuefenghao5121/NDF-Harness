# NDF Harness profile selector (install-time config; not product SoT)
default_profile: dual-track

profiles:
  dual-track:
    requires_poc: true
    requires_agents_md: true
    requires_workflow_yaml: true
    install_norms: full
    install_tools: full
    description: Dual-track explore/promote + full process profile + AGENTS.md + ndf.workflow.yaml

  minimal:
    requires_poc: false
    requires_agents_md: true
    requires_workflow_yaml: true
    install_norms: slim
    install_tools: [index, graphcheck]
    description: Slim norms + AGENTS + workflow profile; index/graphcheck only

  linter-only:
    requires_poc: false
    requires_agents_md: false
    requires_workflow_yaml: false
    install_norms: false
    install_tools: full
    description: Governance CLI only; AGENTS/workflow yaml optional but recommended

runtimes:
  - generic
  - cursor
  - openclaw
  - claude-code
  - opencode

runtime_skill_paths:
  cursor: .cursor/skills/ndf-workflow
  openclaw: skills/ndf-harness
  claude-code: .claude/skills/ndf-harness
  opencode: .opencode/skills/ndf-harness

slim_norms_files:
  - meta/README.md
  - meta/language.md
  - meta/process.md
  - meta/glossary.md
  - meta/architecture.md
  - meta/constraints.md
  - CLAUSE-FORMAT.md

install_map:
  norms_meta: spec/meta
  norms_product_tree: spec
  tools: spec/meta/tools
  templates: spec/meta/templates
  agents: AGENTS.md
  workflow_yaml: ndf.workflow.yaml
